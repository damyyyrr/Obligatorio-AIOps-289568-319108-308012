apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubelet-storage
  namespace: pharmago
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pharmago-kubelet-storage
rules:
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pharmago-kubelet-storage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pharmago-kubelet-storage
subjects:
  - kind: ServiceAccount
    name: kubelet-storage
    namespace: pharmago
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kubelet-storage
  namespace: pharmago
spec:
  selector:
    matchLabels:
      app: kubelet-storage
  template:
    metadata:
      labels:
        app: kubelet-storage
    spec:
      serviceAccountName: kubelet-storage
      tolerations:
        - operator: Exists
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.111.0
          args: ["--config=/etc/kubelet-storage/collector.yaml"]
          env:
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: KUBECONFIG
              value: /etc/kubelet-storage/kubeconfig
          volumeMounts:
            - name: config
              mountPath: /etc/kubelet-storage
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: kubelet-storage-config
