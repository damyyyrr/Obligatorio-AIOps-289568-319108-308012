# Expone kube_pod_status_ready/kube_pod_status_phase para Prometheus (issue #13).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: pharmago
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-state-metrics
  template:
    metadata:
      labels:
        app: kube-state-metrics
    spec:
      serviceAccountName: kube-state-metrics
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values: [ops, all]
      containers:
      - name: kube-state-metrics
        image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.13.0
        args:
          - --namespaces=pharmago
          - --resources=pods,deployments
          - --port=8080
          - --telemetry-port=8081
        ports:
        - containerPort: 8080
          name: metrics
        - containerPort: 8081
          name: telemetry
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /livez
            port: 8080
          periodSeconds: 10
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
        resources:
          requests:
            memory: 32Mi
            cpu: 10m
          limits:
            memory: 128Mi
            cpu: 100m
