# Prueba aislada de timeouts y contención de fallas (issue #10 / RES-03).
# Namespace propio: no toca "pharmago". Mismos nombres de Service que producción para
# que el Gateway use sus direcciones por defecto. Probes iguales a los manifiestos reales.
#
# Requiere el Secret db-secret (SA_PASSWORD y CONNECTION_STRING) creado aparte, con una
# contraseña de prueba generada para la corrida. Imágenes: tag issue10-after; para medir
# la versión anterior: kubectl set image ... :issue10-before
apiVersion: v1
kind: Namespace
metadata:
  name: pharmago-resilience-test
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sql-pvc
  namespace: pharmago-resilience-test
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pharmago-db
  namespace: pharmago-resilience-test
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: pharmago-db }
  template:
    metadata:
      labels: { app: pharmago-db }
    spec:
      securityContext:
        fsGroup: 10001
      containers:
      - name: pharmago-db
        image: mcr.microsoft.com/mssql/server@sha256:07d7dedecdbfcf6776035dc5eefb5bfd9aa1804b2f6b99f7dedb397d8a599069
        ports: [{ containerPort: 1433 }]
        env:
        - { name: ACCEPT_EULA, value: "Y" }
        - { name: MSSQL_PID, value: "Express" }
        - name: MSSQL_SA_PASSWORD
          valueFrom: { secretKeyRef: { name: db-secret, key: SA_PASSWORD } }
        securityContext: { runAsUser: 10001 }
        volumeMounts:
        - { name: sql-storage, mountPath: /var/opt/mssql }
        readinessProbe:
          tcpSocket: { port: 1433 }
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests: { memory: 768Mi, cpu: 500m }
          limits: { memory: 1536Mi, cpu: "1" }
      volumes:
      - name: sql-storage
        persistentVolumeClaim: { claimName: sql-pvc }
---
apiVersion: v1
kind: Service
metadata:
  name: pharmago-db
  namespace: pharmago-resilience-test
spec:
  selector: { app: pharmago-db }
  ports: [{ port: 1433, targetPort: 1433 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pharmago-users-service
  namespace: pharmago-resilience-test
spec:
  replicas: 1
  selector:
    matchLabels: { app: pharmago-users-service }
  template:
    metadata:
      labels: { app: pharmago-users-service }
    spec:
      containers:
      - name: pharmago-users-service
        image: pharmago-users-service:issue10-after
        imagePullPolicy: Never
        ports: [{ name: http, containerPort: 80 }]
        env:
        - { name: ASPNETCORE_ENVIRONMENT, value: Production }
        - name: ConnectionStrings__DefaultConnection
          valueFrom: { secretKeyRef: { name: db-secret, key: CONNECTION_STRING } }
        - { name: Logging__LogLevel__Microsoft.EntityFrameworkCore, value: "None" }
        - { name: Logging__LogLevel__Microsoft.Data.SqlClient, value: "None" }
        startupProbe:
          httpGet: { path: /health/live, port: http }
          periodSeconds: 2
          timeoutSeconds: 2
          failureThreshold: 60
        readinessProbe:
          httpGet: { path: /health/ready, port: http }
          periodSeconds: 5
          timeoutSeconds: 4
          failureThreshold: 1
        livenessProbe:
          httpGet: { path: /health/live, port: http }
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        resources:
          requests: { memory: 128Mi, cpu: 100m }
          limits: { memory: 384Mi, cpu: 500m }
---
apiVersion: v1
kind: Service
metadata:
  name: pharmago-users-service
  namespace: pharmago-resilience-test
spec:
  selector: { app: pharmago-users-service }
  ports: [{ port: 80, targetPort: 80 }]
---
