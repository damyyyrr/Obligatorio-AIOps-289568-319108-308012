---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pharmago-api-gateway
  namespace: pharmago-resilience-test
spec:
  replicas: 1
  selector:
    matchLabels: { app: pharmago-api-gateway }
  template:
    metadata:
      labels: { app: pharmago-api-gateway }
    spec:
      containers:
      - name: pharmago-api-gateway
        image: pharmago-api-gateway:issue10-after
        imagePullPolicy: Never
        ports: [{ name: http, containerPort: 80 }]
        env:
        - { name: ASPNETCORE_ENVIRONMENT, value: Production }
        # La prueba genera más tráfico que el límite de 100/min desde un único cliente.
        - { name: RateLimiting__Mode, value: Disabled }
        startupProbe:
          httpGet: { path: /health/live, port: http }
          periodSeconds: 2
          timeoutSeconds: 2
          failureThreshold: 60
        readinessProbe:
          httpGet: { path: /health/ready, port: http }
          periodSeconds: 5
          timeoutSeconds: 4
          failureThreshold: 1
        livenessProbe:
          httpGet: { path: /health/live, port: http }
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        resources:
          requests: { memory: 128Mi, cpu: 100m }
          limits: { memory: 384Mi, cpu: 500m }
---
apiVersion: v1
kind: Service
metadata:
  name: pharmago-api-gateway
  namespace: pharmago-resilience-test
spec:
  selector: { app: pharmago-api-gateway }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: pharmago-resilience-test
spec:
  containers:
  - name: python
    image: python:3.11-alpine
    command: ["sleep", "7200"]
    resources:
      requests: { cpu: 50m, memory: 32Mi }
      limits: { cpu: 500m, memory: 192Mi }
