apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: pharmago
data:
  pharmago-overview.json: |
    {
      "uid": "pharmago-overview",
      "title": "PharmaGo - Overview",
      "version": 1,
      "schemaVersion": 38,
      "refresh": "10s",
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Solicitudes por servicio y endpoint",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (service_name, endpoint) (rate(pharmago_http_requests_total{job=\"otlp-collector\",namespace=\"pharmago\",service_name!=\"\",endpoint!~\"/(metrics|health)(/.*)?\"}[2m]))",
              "legendFormat": "{{service_name}} · {{endpoint}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Solicitudes por pod",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (service_name, pod) (rate(pharmago_http_requests_total{job=\"otlp-collector\",namespace=\"pharmago\",service_name!=\"\",endpoint!~\"/(metrics|health)(/.*)?\"}[2m]) and on(namespace, pod) (up{job=\"pharmago-app-pods\"} == 1))",
              "legendFormat": "{{service_name}} · {{pod}}"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Latencia media por servicio",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ms"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (service_name) (rate(pharmago_http_request_duration_milliseconds_sum{job=\"otlp-collector\",namespace=\"pharmago\",service_name!=\"\",endpoint!~\"/(metrics|health)(/.*)?\"}[2m])) / sum by (service_name) (rate(pharmago_http_request_duration_milliseconds_count{job=\"otlp-collector\",namespace=\"pharmago\",service_name!=\"\",endpoint!~\"/(metrics|health)(/.*)?\"}[2m]))",
              "legendFormat": "{{service_name}}"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Respuestas 5xx por servicio",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "100 * (sum by (service_name) (rate(pharmago_http_requests_total{job=\"otlp-collector\",namespace=\"pharmago\",service_name!=\"\",endpoint!~\"/(metrics|health)(/.*)?\",status_code=~\"5..\"}[2m])) or 0 * sum by (service_name) (rate(pharmago_http_requests_total{job=\"otlp-collector\",namespace=\"pharmago\",service_name!=\"\",endpoint!~\"/(metrics|health)(/.*)?\"}[2m]))) / clamp_min(sum by (service_name) (rate(pharmago_http_requests_total{job=\"otlp-collector\",namespace=\"pharmago\",service_name!=\"\",endpoint!~\"/(metrics|health)(/.*)?\"}[2m])), 0.000001)",
              "legendFormat": "{{service_name}}"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Respuestas 429 por servicio",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (service_name) (rate(pharmago_http_requests_total{job=\"otlp-collector\",namespace=\"pharmago\",service_name!=\"\",endpoint!~\"/(metrics|health)(/.*)?\",status_code=\"429\"}[2m]))",
              "legendFormat": "{{service_name}}"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Estado del scrape de cada pod",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "up{job=\"pharmago-app-pods\"}",
              "legendFormat": "{{node}} · {{pod}}"
            }
          ]
        }
      ]
    }
