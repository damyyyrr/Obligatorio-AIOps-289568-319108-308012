apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: pharmago
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: 'otlp-collector'
        kubernetes_sd_configs: &pharmago-pods
          - role: pod
            namespaces:
              names: [pharmago]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app, __meta_kubernetes_pod_container_port_number, __meta_kubernetes_pod_phase]
            regex: 'otlp-collector;8889;Running'
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: collector_pod
        metric_relabel_configs:
          - source_labels: [k8s_namespace_name]
            target_label: namespace
          - source_labels: [k8s_pod_name]
            target_label: pod
          - source_labels: [k8s_node_name]
            target_label: node
          - source_labels: [k8s_container_name]
            target_label: container
          - action: labeldrop
            regex: 'k8s_(namespace_name|pod_name|node_name|container_name)'

      # /metrics verifica cada destino. Prometheus conserva up y descarta las
      # muestras de la app porque los contadores llegan por OTLP.
      - job_name: 'pharmago-app-pods'
        kubernetes_sd_configs: *pharmago-pods
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app, __meta_kubernetes_pod_container_port_number, __meta_kubernetes_pod_phase]
            regex: 'pharmago-(api-gateway|users-service|pharmacy-service);80;Running'
            action: keep
          - &namespace-label
            source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - &pod-label
            source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - &node-label
            source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: '.+'
            action: drop

      - job_name: 'node-exporter'
        kubernetes_sd_configs: *pharmago-pods
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app, __meta_kubernetes_pod_container_port_number, __meta_kubernetes_pod_phase]
            regex: 'node-exporter;9100;Running'
            action: keep
          - *namespace-label
          - *pod-label
          - *node-label

      # cAdvisor: métricas por contenedor/pod (para ver impacto de chaos)
      - job_name: 'kubernetes-cadvisor'
        kubernetes_sd_configs:
        - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
        - target_label: __address__
          replacement: kubernetes.default.svc:443
        - source_labels: [__meta_kubernetes_node_name]
          regex: (.+)
          target_label: __metrics_path__
          replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
        - source_labels: [__meta_kubernetes_node_name]
          target_label: node
        - source_labels: [__meta_kubernetes_node_name]
          target_label: instance

